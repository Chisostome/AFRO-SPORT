name: Build AFRO SPORT Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android version code"
        required: true
        default: "1"
  push:
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "docs/**"
      - ".github/workflows/release-android.yml"

permissions:
  contents: read

jobs:
  release:
    name: Signed Android APK + AAB
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      VERSION_CODE: ${{ inputs.version_code || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Verify Google Play target SDK
        run: |
          grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
          test "$(grep -E "targetSdkVersion = 36" android/variables.gradle | wc -l)" -ge 1

      - name: Generate upload keystore
        id: keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_ALIAS="afro-sport-upload"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p build/signing
          keytool -genkeypair -v \
            -keystore build/signing/afro-sport-upload.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=AFRO SPORT, OU=Mobile, O=AFRO SPORT, L=Dar es Salaam, ST=Dar es Salaam, C=TZ"
          {
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
          } > build/signing/release-signing-info.txt
          chmod 600 build/signing/afro-sport-upload.jks build/signing/release-signing-info.txt
          echo "store=$GITHUB_WORKSPACE/build/signing/afro-sport-upload.jks" >> "$GITHUB_OUTPUT"
          echo "alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "store_password=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Configure release signing and version
        shell: bash
        env:
          KEYSTORE: ${{ steps.keystore.outputs.store }}
          KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          cat > android/release-signing.gradle <<'EOF'
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("AFRO_VERSION_CODE"))
                  versionName System.getenv("AFRO_VERSION_NAME")
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("AFRO_KEYSTORE"))
                      storePassword System.getenv("AFRO_STORE_PASSWORD")
                      keyAlias System.getenv("AFRO_KEY_ALIAS")
                      keyPassword System.getenv("AFRO_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          printf '\napply from: rootProject.file("release-signing.gradle")\n' >> android/app/build.gradle

          {
            echo "AFRO_KEYSTORE=$KEYSTORE"
            echo "AFRO_KEY_ALIAS=$KEY_ALIAS"
            echo "AFRO_STORE_PASSWORD=$STORE_PASSWORD"
            echo "AFRO_KEY_PASSWORD=$KEY_PASSWORD"
            echo "AFRO_VERSION_NAME=$VERSION_NAME"
            echo "AFRO_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        run: |
          ./gradlew clean assembleRelease bundleRelease

      - name: Verify release outputs
        run: |
          ls -lh android/app/build/outputs/apk/release/*.apk
          ls -lh android/app/build/outputs/bundle/release/*.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/AFRO-SPORT-${VERSION_NAME}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/AFRO-SPORT-${VERSION_NAME}-release.aab"
          cp build/signing/afro-sport-upload.jks dist/AFRO-SPORT-upload-key.jks
          cp build/signing/release-signing-info.txt dist/AFRO-SPORT-upload-key.txt
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload Google Play package
        uses: actions/upload-artifact@v4
        with:
          name: afro-sport-google-play-release
          path: dist/*
          retention-days: 30
