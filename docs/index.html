  <script>
    const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('sidebarOverlay');
    document.getElementById('menuToggle')?.addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show')});
    document.getElementById('sidebarClose')?.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show')});
    overlay?.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('show')});
    addEventListener('hashchange',()=>{sidebar.classList.remove('open');overlay.classList.remove('show')});
  </script>
