<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFRO SPORT — Weka Nenosiri Jipya</title>
<link rel="stylesheet" href="./styles.css?v=20261002-14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/afro-sport-logo.jpg" type="image/jpeg">
<meta name="theme-color" content="#0b0b0b">
<style>
.reset-shell{min-height:100vh;display:grid;place-items:center;background:#f5f7f8;padding:24px}
.reset-card{width:min(460px,100%);background:#fff;border:1px solid #e5e9ec;border-radius:24px;padding:34px;box-shadow:0 18px 60px rgba(0,0,0,.08)}
.reset-logo{width:88px;height:88px;object-fit:cover;border-radius:18px;margin-bottom:20px}.reset-card h1{margin:0 0 8px}.reset-card p{line-height:1.6}
.reset-form{display:grid;gap:9px;margin-top:24px}.reset-form label{margin-top:6px;font-size:12px}.reset-form button{margin-top:12px}
.reset-message{min-height:22px;font-size:13px}.error{color:#b42318}.success{color:#176b4f}
.reset-back{display:block;margin-top:18px;color:#0d5c45;text-decoration:none;font-size:13px;font-weight:800}
</style>
</head>
<body>
<main class="reset-shell">
<section class="reset-card">
<img class="reset-logo" src="./assets/afro-sport-logo.jpg" alt="AFRO SPORT">
<p class="eyebrow">MICHEZO YA AFRO</p>
<h1>Weka nenosiri jipya</h1>
<p class="muted">Tengeneza nenosiri jipya la akaunti yako ya AFRO SPORT.</p>
<form id="reset-form" class="reset-form">
<label for="password">Nenosiri jipya</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="password-confirm">Rudia nenosiri</label>
<input id="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="reset-button" type="submit">Hifadhi nenosiri</button>
<div id="reset-message" class="reset-message" aria-live="polite"></div>
</form>
<a class="reset-back" href="./auth.html">← Rudi kwenye Ingia / Jisajili</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const {createClient}=window.supabase;
const sb=createClient(window.AFRO_SUPABASE_URL,window.AFRO_SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("reset-form"),button=document.getElementById("reset-button"),message=document.getElementById("reset-message");
function show(text,type){message.textContent=text;message.className="reset-message "+(type||"")}
let recoveryReady=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"&&session) recoveryReady=true;
});
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) recoveryReady=true;
  else show("Kiungo cha kurejesha nenosiri hakipo au kimekwisha muda wake. Omba kiungo kipya kupitia ukurasa wa Ingia.","error");
})();
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const p=document.getElementById("password").value,p2=document.getElementById("password-confirm").value;
  if(p!==p2){show("Nenosiri mbili hazifanani.","error");return}
  if(!recoveryReady){show("Fungua ukurasa huu kupitia kiungo kilichotumwa kwenye barua pepe.","error");return}
  button.disabled=true;button.textContent="Inahifadhi...";
  const {error}=await sb.auth.updateUser({password:p});
  if(error){show(error.message||"Imeshindikana kubadilisha nenosiri.","error");button.disabled=false;button.textContent="Hifadhi nenosiri";return}
  show("Nenosiri limebadilishwa. Unaweza kuingia kwa nenosiri jipya.","success");
  await sb.auth.signOut();
  setTimeout(()=>location.href="./auth.html",1200);
});
</script>
</body>
</html>
