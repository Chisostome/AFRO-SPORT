<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AFRO SPORT — Mchezaji</title><link rel="stylesheet" href="./styles.css?v=20261002-7">  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/afro-sport-logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="./assets/afro-sport-logo.jpg">
  <meta name="theme-color" content="#0b0b0b">
</head>
<body class="admin-body">
<aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark">AS</div><div><strong>AFRO SPORT</strong><span>MICHEZO YA AFRO</span></div></div><nav class="admin-nav"><a href="./dashboard.html">⌂ <span>Dashibodi</span></a><a href="./leagues.html">🏆 <span>Ligi</span></a><a href="./teams.html">⚽ <span>Timu</span></a><a class="active" href="./players.html">👤 <span>Wachezaji</span></a><a href="./matches.html">📅 <span>Mechi</span></a><a href="./standings.html">📊 <span>Msimamo</span></a><a href="./scorers.html">🥇 <span>Wafungaji Bora</span></a><a href="./stats.html">📈 <span>Takwimu</span></a></nav><button class="logout-button" id="logout">Toka</button></aside>
<main class="admin-main"><header class="topbar"><div><p class="eyebrow">MCHEZAJI</p><h1 id="page-title">Inapakia...</h1></div><div class="admin-user"><strong id="role-label">Inapakia...</strong><span id="user-email"></span></div></header>
<div class="form-actions" style="margin-bottom:16px"><a href="./players.html" class="secondary-button">← Rudi Wachezaji</a><button class="primary-button" id="edit-player">Hariri Mchezaji</button></div>
<section class="player-detail-layout">
<article class="panel"><div id="profile"><p class="empty-state">Inapakia taarifa...</p></div><div id="player-info" class="player-info-grid"></div></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">TIMU NA MISIMU</p><h3>Ushiriki wa mchezaji</h3></div></div><div id="player-teams" class="player-team-list"><p class="empty-state">Inapakia...</p></div></article>
</section><section class="panel form-panel" id="edit-panel" hidden><div class="panel-head"><div><p class="eyebrow">HARIRI</p><h3>Hariri taarifa za mchezaji</h3></div></div><form id="edit-form" class="admin-form"><label>Jina la kwanza</label><input id="edit-first" required><label>Jina la mwisho</label><input id="edit-last" required><label>Utaifa</label><input id="edit-nationality"><label>Tarehe ya kuzaliwa</label><input id="edit-dob" type="date"><label>Nafasi</label><select id="edit-position"><option value="">Chagua nafasi</option><option>Mlinda lango</option><option>Beki</option><option>Kati</option><option>Winga</option><option>Mshambuliaji</option></select><div class="assignment-box"><p class="eyebrow">TIMU NA MSIMU</p><label>Timu</label><select id="edit-team"><option value="">Hakuna timu</option></select><label>Msimu</label><select id="edit-season"><option value="">Hakuna msimu</option></select><label>Namba ya jezi</label><input id="edit-shirt" type="number" min="0" max="99"></div><div class="form-actions"><button type="button" class="secondary-button" id="cancel-edit">Ghairi</button><button class="primary-button" id="save-edit">Hifadhi Mabadiliko</button></div><p id="edit-message" class="message"></p></form></section><p id="page-message" class="message page-message"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const{createClient}=window.supabase;const sb=createClient(window.AFRO_SUPABASE_URL,window.AFRO_SUPABASE_PUBLISHABLE_KEY);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const id=new URLSearchParams(location.search).get("id");
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user){location.href="./index.html";return;}const{data:role}=await sb.from("user_roles").select("role").eq("user_id",user.id).maybeSingle();if(!role||!["admin","super_admin"].includes(role.role)){await sb.auth.signOut();location.href="./index.html";return;}document.getElementById("role-label").textContent=role.role==="super_admin"?"Super Admin":"Admin";document.getElementById("user-email").textContent=user.email||"";if(!id){document.getElementById("page-title").textContent="Mchezaji haijachaguliwa";return;}
const{data:p,error}=await sb.from("players").select("id,first_name,last_name,photo_url,nationality,date_of_birth,position,player_seasons(id,team_id,season_id,squad_number,joined_on,left_on,teams(id,name,slug,logo_url),seasons(id,name,league_id,leagues(name)))").eq("id",id).maybeSingle();
if(error||!p){document.getElementById("page-title").textContent="Mchezaji haipatikani";document.getElementById("profile").innerHTML='<p class="empty-state error-state">Taarifa za mchezaji hazikupatikana.</p>';return;}
const full=(p.first_name+" "+p.last_name).trim();document.getElementById("page-title").textContent=full;
const teams=await sb.from("teams").select("id,name").order("name"); const seasons=await sb.from("seasons").select("id,name,league_id,leagues(name)").order("name",{ascending:false}); const et=document.getElementById("edit-team"),es=document.getElementById("edit-season"); et.innerHTML="<option value=\"\">Hakuna timu</option>"+(teams.data||[]).map(t=>"<option value=\""+t.id+"\">"+esc(t.name)+"</option>").join(""); es.innerHTML="<option value=\"\">Hakuna msimu</option>"+(seasons.data||[]).map(s=>"<option value=\""+s.id+"\">"+esc(s.leagues?.name||"Ligi")+" — "+esc(s.name)+"</option>").join(""); document.getElementById("edit-first").value=p.first_name;document.getElementById("edit-last").value=p.last_name;document.getElementById("edit-nationality").value=p.nationality||"";document.getElementById("edit-dob").value=p.date_of_birth||"";document.getElementById("edit-position").value=p.position||""; const current=(p.player_seasons||[])[0]; if(current){et.value=current.team_id;es.value=current.season_id;document.getElementById("edit-shirt").value=current.squad_number??"";}
document.getElementById("profile").innerHTML='<div class="player-profile"><div class="player-profile-avatar">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'👤')+'</div><div><p class="eyebrow">MCHEZAJI</p><h2>'+esc(full)+'</h2><p>'+esc(p.position||"Nafasi haijawekwa")+(p.nationality?" · "+esc(p.nationality):"")+'</p></div></div>';
document.getElementById("player-info").innerHTML='<div><span>Jina la kwanza</span><strong>'+esc(p.first_name)+'</strong></div><div><span>Jina la mwisho</span><strong>'+esc(p.last_name)+'</strong></div><div><span>Utaifa</span><strong>'+esc(p.nationality||"—")+'</strong></div><div><span>Tarehe ya kuzaliwa</span><strong>'+esc(p.date_of_birth||"—")+'</strong></div><div><span>Nafasi</span><strong>'+esc(p.position||"—")+'</strong></div>';
const list=document.getElementById("player-teams");const rows=p.player_seasons||[];if(!rows.length){list.innerHTML='<p class="empty-state">Mchezaji bado hajaunganishwa na timu/msimu.</p>';}else{list.innerHTML=rows.map(r=>'<div class="player-team-item"><div><strong>'+esc(r.teams?.name||"Timu")+'</strong><span>'+esc(r.seasons?.leagues?.name||"Ligi")+" · "+esc(r.seasons?.name||"Msimu")+(r.squad_number?" · Jezi #"+esc(r.squad_number):"")+'</span></div><span>'+esc(r.joined_on||"")+'</span></div>').join("");}
document.getElementById("edit-player").onclick=()=>document.getElementById("edit-panel").hidden=false;document.getElementById("cancel-edit").onclick=()=>document.getElementById("edit-panel").hidden=true;document.getElementById("edit-form").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("save-edit"),m=document.getElementById("edit-message");b.disabled=true;b.textContent="Inahifadhi...";const first=document.getElementById("edit-first").value.trim(),last=document.getElementById("edit-last").value.trim();const up={first_name:first,last_name:last,nationality:document.getElementById("edit-nationality").value.trim()||null,date_of_birth:document.getElementById("edit-dob").value||null,position:document.getElementById("edit-position").value||null};const{error}=await sb.from("players").update(up).eq("id",id);if(error){m.textContent="Imeshindikana kuhifadhi mabadiliko.";b.disabled=false;b.textContent="Hifadhi Mabadiliko";return;}const team=document.getElementById("edit-team").value,season=document.getElementById("edit-season").value;await sb.from("player_seasons").delete().eq("player_id",id);if((team&&!season)||(!team&&season)){m.textContent="Chagua timu na msimu pamoja.";b.disabled=false;b.textContent="Hifadhi Mabadiliko";return;}if(team&&season){const{error:ae}=await sb.from("player_seasons").insert({player_id:id,team_id:team,season_id:season,squad_number:Number(document.getElementById("edit-shirt").value)||null});if(ae){m.textContent="Taarifa zimehifadhiwa lakini ushiriki haukuhifadhiwa.";b.disabled=false;b.textContent="Hifadhi Mabadiliko";return;}}location.reload();};
})();
document.querySelectorAll("[data-coming]").forEach(l=>l.onclick=e=>{e.preventDefault();document.getElementById("page-message").textContent=l.dataset.coming+" itajengwa katika hatua inayofuata.";});document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="./index.html"};
</script></body></html>
